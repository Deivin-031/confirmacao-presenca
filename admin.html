<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel de confirmações</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><header class="hero compact"><div class="eyebrow">PAINEL DO ORGANIZADOR</div><h1>Lista de convidados</h1><p>Gerencie os convites por família.</p></header><section class="panel" id="loginSection"><h2>Entrar</h2><form id="loginForm"><label>E-mail <input id="email" type="email" required autocomplete="username"></label><label>Senha <input id="password" type="password" required autocomplete="current-password"></label><button>Entrar no painel</button></form></section><div id="dashboard" hidden><div class="toolbar"><button id="logout" class="outline">Sair</button><button id="export" class="outline">Exportar CSV</button></div><section class="stats" id="stats"></section><section class="panel"><h2>Adicionar família</h2><form id="createForm"><label>Nome da família ou grupo<input id="newName" required maxlength="100" placeholder="Ex.: Família Silva"></label><label>Integrantes (um por linha)<textarea id="newMembers" rows="5" required placeholder="Maria Silva&#10;José Silva&#10;Ana Silva"></textarea></label><button id="createBtn">Cadastrar e gerar link</button></form><p id="newLink" role="status"></p></section><section class="panel"><h2>Famílias cadastradas</h2><label>Pesquisar<input id="search" placeholder="Nome da família ou integrante"></label><div id="familiesList" class="family-list"></div></section></div><p id="feedback" role="status"></p></main><script type="module" src="admin.js"></script></body></html>
